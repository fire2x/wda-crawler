name: 自動抓取課程報名人數

on:
  schedule:
    # 每天固定排程執行（UTC 01:00 = 台灣時間 09:00）
    - cron: '0 1,5,9 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動執行

# 賦予寫入權限，確保 git push 與寫入正常
permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 簽出程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread oauth2client

      - name: 4. 執行爬蟲與同步
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scraper.py

      - name: 5. 提交本機 courses.json 變更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 將產生的 JSON 檔案加入暫存
          git add data/courses.json
          
          # 檢查是否有檔案變動，有變動才 commit 與 push
          if ! git diff --staged --quiet; then
            git commit -m "自動更新課程資料: $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 成功將最新 courses.json 推送至儲存庫"
          else
            echo "ℹ️ 資料沒有變更，跳過提交"
          fi
