name: 自動抓取課程報名人數

on:
  schedule:
    # 每天定時執行（例如台灣時間 09:00、13:00、17:00）
    - cron: '0 1,5,9 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動執行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 簽出程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          pip install requests gspread oauth2client

      - name: 4. 執行爬蟲與同步
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scraper.py

      - name: 5. 提交本機 courses.json 變更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/courses.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新課程資料: $(date)" && git push)
