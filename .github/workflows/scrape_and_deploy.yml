name: Scrape TaiwanJobs Courses and Deploy

# 觸發條件：
# 1. 每天 UTC 時間 00:00 自動執行
# 2. 當有 push 到 main 分支時執行 (方便手動更新)
# 3. 允許手動在 Actions 頁面觸發
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 給予 workflow 寫入 repository 的權限

    steps:
      # 步驟 1: Check out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步驟 2: 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步驟 3: 安裝 Python 爬蟲所需的套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 步驟 4: 執行爬蟲腳本，生成 courses.json
      - name: Run scraper to fetch courses
        run: python scraper.py

      # 步驟 5: 檢查檔案是否有變動，若有則 commit 並 push
      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add courses.json
          # 如果 git status 偵測到有變動，才進行 commit
          if ! git diff --staged --quiet; then
            git commit -m "📊 [Automated] Update course data"
            git push
          else
            echo "✅ No changes to course data. Skipping commit."
          fi

      # 步驟 6: 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . # 發布整個 repository 的根目錄
