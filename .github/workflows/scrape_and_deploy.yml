name: Scrape TaiwanJobs Courses

# 觸發條件：
# 1. 每天午夜 00:00 (UTC) 定時自動執行
# 2. 當有更新 push 到 main 分支時執行
# 3. 支援在 Actions 頁面手動點擊 Run workflow
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 給予將更新後的 courses.json 推送回 main 分支的寫入權限

    steps:
      # 步驟 1: Check out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步驟 2: 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步驟 3: 安裝爬蟲所需套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 步驟 4: 執行爬蟲，抓取所有課程與即時報名人數
      - name: Run scraper to fetch courses
        run: python scraper.py

      # 步驟 5: 檢查資料變動並自動 Commit & Push
      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add courses.json
          
          # 檢查是否有檔案異動，有異動才 commit
          if git diff --cached --quiet; then
            echo "✅ 課程資料無變動，略過 Commit。"
          else
            echo "📊 偵測到最新課程資料，正在提交並推送至 main 分支..."
            git commit -m "📊 [Automated] Update courses data with registration stats"
            git push
          fi
