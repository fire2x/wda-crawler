name: Scrape TaiwanJobs Courses

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (台灣早上 8 點) 自動跑
  push:
    branches:
      - main
  workflow_dispatch:     # 支援手動在 Actions 頁面點擊 Run

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 給予推送 courses.json 回 main 分支的寫入權限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper to fetch courses
        run: python scraper.py

      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add courses.json
          
          if git diff --cached --quiet; then
            echo "✅ 課程資料無變動，略過 Commit。"
          else
            echo "📊 偵測到課程資料有更新，正在推送回 main 分支..."
            git commit -m "📊 [Automated] Update courses.json via python scraper"
            git push
          fi
