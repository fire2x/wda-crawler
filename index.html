<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>課程爬蟲即時展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-2 text-gray-800">勞動力發展署課程爬蟲測試</h1>
        <p class="text-sm text-gray-500 mb-4">資料來源：GitHub Actions 自動更新之 data.json</p>
        
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">課程名稱</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">訓練計畫</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">培訓地點</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">報名起訖</th>
                        <th class="px-4 py-2 text-center text-xs font-medium text-gray-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="bg-white divide-y divide-gray-200 text-sm">
                    <tr><td colspan="5" class="px-4 py-4 text-center text-gray-400">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-4 py-3 font-medium text-gray-900">${item.title}</td>
                        <td class="px-4 py-3 text-gray-600">${item.plan}</td>
                        <td class="px-4 py-3 text-gray-600">${item.location}</td>
                        <td class="px-4 py-3 text-gray-600">${item.reg_date}</td>
                        <td class="px-4 py-3 text-center">
                            <a href="${item.url}" target="_blank" class="text-blue-600 hover:underline">連結</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-red-500">載入失敗，請確認 data.json 是否已生成</td></tr>`;
            });
    </script>
</body>
</html>
